plugins {
    id "org.jetbrains.kotlin.multiplatform"
    id "org.jetbrains.kotlin.plugin.serialization"
}

apply from: rootProject.file('gradle/publish.gradle')

kotlin {
    abiValidation {
        enabled = true
    }

    jvm {
        compilations.all {
            kotlinOptions {
                jvmTarget = '1.8'
            }
        }
    }

    js {
        browser()
        nodejs()
    }

    wasmJs {
        browser()
    }

    // Apple targets
    iosArm64()
    iosX64()
    iosSimulatorArm64()
    macosArm64()
    macosX64()
    tvosArm64()
    tvosSimulatorArm64()
    watchosArm32()
    watchosArm64()
    watchosSimulatorArm64()

    // Desktop/Server targets
    linuxX64()
    linuxArm64()
    mingwX64()

    sourceSets {
        commonMain {
            dependencies {
                implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
            }
        }
        commonTest {
            dependencies {
                implementation kotlin('test')
            }
        }
    }
}
